<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Global Time Zones</h1>
        <div class="clocks-grid">
            <div class="clock-card">
                <h2>Dhaka (Bangladesh)</h2>
                <div class="clock" id="dhaka"></div>
                <p class="timezone">BST (UTC+6)</p>
            </div>
            <div class="clock-card">
                <h2>New York</h2>
                <div class="clock" id="newyork"></div>
                <p class="timezone">EST/EDT (UTC-5/UTC-4)</p>
            </div>
            <div class="clock-card">
                <h2>London</h2>
                <div class="clock" id="london"></div>
                <p class="timezone">GMT/BST (UTC+0/UTC+1)</p>
            </div>
            <div class="clock-card">
                <h2>Tokyo</h2>
                <div class="clock" id="tokyo"></div>
                <p class="timezone">JST (UTC+9)</p>
            </div>
            <div class="clock-card">
                <h2>Sydney</h2>
                <div class="clock" id="sydney"></div>
                <p class="timezone">AEST/AEDT (UTC+10/UTC+11)</p>
            </div>
            <div class="clock-card">
                <h2>Los Angeles</h2>
                <div class="clock" id="losangeles"></div>
                <p class="timezone">PST/PDT (UTC-8/UTC-7)</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
