<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar For Bangladesh </title>
<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .calendar-container {
      width: 600px;
      background: white;
      padding: 20px 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .month-card {
      border: 1px solid #ccc;
    }
    .month-header {
      background-color: black;
      color: white;
      text-align: center;
      padding: 4px;
      font-weight: bold;
      font-size: 14px;
    }
    .week-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: #2b5797;
      color: white;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 0;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      padding: 5px 0;
      row-gap: 4px;
    }
    .day {
      padding: 2px 0;
    }
    .holiday {
      color: red;
      font-weight: bold;
    }
    .holidays-section {
      margin-top: 20px;
      font-size: 12px;
    }
    .holidays-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .holidays-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 20px;
    }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="header">
    <span id="year-title">2026</span>
    <span>Calendar for Bangladesh</span>
  </div>

  <div class="months-grid" id="calendar"></div>

  <div class="holidays-section">
    <div class="holidays-title" id="holiday-title">Holidays for Bangladesh</div>
    <div class="holidays-list" id="holiday-list">
      <div><b>Feb 21</b> Language Day</div>
      <div><b>Mar 26</b> Independence Day</div>
      <div><b>April 14</b> Bangla New year</div>
      <div><b>May 01</b> may day</div>
      <div><b>Dec 16</b> Victory Day</div>
      <div><b>Dec 25</b> Christmas Day</div>
    </div>
  </div>
</div>

<script>
  const year = 2026;
  document.getElementById('year-title').innerText = year;
  document.getElementById('holiday-title').innerText = `${year} Holidays for Bangladesh`;

  const monthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  const calendarDiv = document.getElementById("calendar");

  for (let month = 0; month < 12; month++) {
    const monthCard = document.createElement("div");
    monthCard.className = "month-card";

    const monthHeader = document.createElement("div");
    monthHeader.className = "month-header";
    monthHeader.innerText = monthNames[month];
    monthCard.appendChild(monthHeader);

    const weekDays = document.createElement("div");
    weekDays.className = "week-days";
    ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
      const dayDiv = document.createElement("div");
      dayDiv.innerText = day;
      weekDays.appendChild(dayDiv);
    });
    monthCard.appendChild(weekDays);

    const daysGrid = document.createElement("div");
    daysGrid.className = "days-grid";

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const emptyDiv = document.createElement("div");
      daysGrid.appendChild(emptyDiv);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayDiv = document.createElement("div");
      dayDiv.className = "day";
      
      const dayOfWeek = new Date(year, month, day).getDay();
      if (dayOfWeek === 5) { // শুক্রবার লাল রঙের ছুটির দিন
        dayDiv.classList.add("holiday");
      }

      dayDiv.innerText = day;
      daysGrid.appendChild(dayDiv);
    }

    monthCard.appendChild(daysGrid);
    calendarDiv.appendChild(monthCard);
  }
</script>
</html>
